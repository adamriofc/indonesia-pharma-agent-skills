<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="100%">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Title Accent Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Emerald / Teal Medical Accent Gradient -->
    <linearGradient id="medical-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- Card Background with Subtle Border -->
  <rect width="1200" height="280" rx="10" fill="url(#bg-grad)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Top Medical Accent Bar -->
  <rect x="0" y="0" width="1200" height="4" rx="2" fill="url(#medical-grad)"/>

  <!-- Main Title & Subtitle -->
  <g transform="translate(48, 48)">
    <text x="0" y="30" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="url(#title-grad)" letter-spacing="-0.8">
      indonesia-pharma-agent-skills
    </text>

    <text x="0" y="62" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#94A3B8" letter-spacing="-0.1">
      Pharmaceutical &amp; Healthcare Regulatory Engine Extension for indonesia-business-agent-skills
    </text>
  </g>

  <!-- Runtime Compatibility Pills Row -->
  <g transform="translate(48, 126)">
    <!-- Hub & Spoke -->
    <rect x="0" y="0" width="100" height="22" rx="11" fill="#2D1B4E" stroke="#7C3AED" stroke-width="1"/>
    <text x="50" y="15" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#C4B5FD" text-anchor="middle">Hub &amp; Spoke</text>
    <!-- Core Extension -->
    <rect x="108" y="0" width="108" height="22" rx="11" fill="#1E3A5F" stroke="#2563EB" stroke-width="1"/>
    <text x="162" y="15" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#93C5FD" text-anchor="middle">Core Extension</text>
    <!-- BPOM & Kemenkes -->
    <rect x="224" y="0" width="124" height="22" rx="11" fill="#1A2F1A" stroke="#059669" stroke-width="1"/>
    <text x="286" y="15" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#6EE7B7" text-anchor="middle">BPOM &amp; Kemenkes</text>
    <!-- CPOB / CDOB -->
    <rect x="356" y="0" width="94" height="22" rx="11" fill="#1A2F1A" stroke="#16A34A" stroke-width="1"/>
    <text x="403" y="15" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#86EFAC" text-anchor="middle">CPOB / CDOB</text>
    <!-- TKDN Farmasi -->
    <rect x="458" y="0" width="104" height="22" rx="11" fill="#3B1F00" stroke="#EA580C" stroke-width="1"/>
    <text x="510" y="15" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#FDBA74" text-anchor="middle">TKDN Farmasi</text>
    <!-- WHO-UMC MESO -->
    <rect x="570" y="0" width="112" height="22" rx="11" fill="#3B1F00" stroke="#D97706" stroke-width="1"/>
    <text x="626" y="15" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#FCD34D" text-anchor="middle">WHO-UMC MESO</text>
    <!-- UU PDP Kesehatan -->
    <rect x="690" y="0" width="126" height="22" rx="11" fill="#1E3A5F" stroke="#0284C7" stroke-width="1"/>
    <text x="753" y="15" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#7DD3FC" text-anchor="middle">UU PDP Kesehatan</text>
    <!-- USP <1079> MKT -->
    <rect x="824" y="0" width="114" height="22" rx="11" fill="#134E4A" stroke="#0D9488" stroke-width="1"/>
    <text x="881" y="15" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#5EEAD4" text-anchor="middle">USP &lt;1079&gt; MKT</text>
  </g>

  <!-- Horizontal Separator Line -->
  <line x1="48" y1="172" x2="1152" y2="172" stroke="#1E293B" stroke-width="1"/>

  <!-- 4 Stat Columns -->
  <g transform="translate(0, 196)">
    <!-- Stat 1: Domain Skills -->
    <g transform="translate(48, 0)">
      <text x="0" y="0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#64748B" letter-spacing="0.8">DOMAIN SKILLS</text>
      <text x="0" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="17" font-weight="700" fill="#38BDF8">6 Production Skills</text>
    </g>

    <!-- Stat 2: Deterministic Engines -->
    <g transform="translate(334, 0)">
      <text x="0" y="0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#64748B" letter-spacing="0.8">COMPUTATIONAL ENGINES</text>
      <text x="0" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="17" font-weight="700" fill="#34D399">6 Invariant Engines</text>
    </g>

    <!-- Stat 3: Regulatory Statutes -->
    <g transform="translate(620, 0)">
      <text x="0" y="0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#64748B" letter-spacing="0.8">REGULATORY STATUTES</text>
      <text x="0" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="17" font-weight="700" fill="#FBBF24">9 Laws &amp; PerBPOM</text>
    </g>

    <!-- Stat 4: Security & Quality Gate -->
    <g transform="translate(906, 0)">
      <text x="0" y="0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#64748B" letter-spacing="0.8">SECURITY &amp; RUNTIME</text>
      <text x="0" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="17" font-weight="700" fill="#C084FC">10-Check Gate / 0 Deps</text>
    </g>
  </g>
</svg>
